name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reproduce:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator g++ make python3-matplotlib

    - name: Tool versions
      run: |
        verilator --version
        g++ --version | head -1
        python3 --version

    - name: Lint RTL
      run: make Lint

    - name: Cross-validate, correlate, sweep, plot
      run: make reproduce
    
    - name: Upload figures
      uses: actions/upload-artifact@v4
      with:
        name: figures
        path: docs/figures/